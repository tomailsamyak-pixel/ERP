<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EFF1F7;--card:#FFFFFF;--ink:#161B3D;--muted:#5C6288;--line:#DCDFEC;--soft:#F5F6FB;
--indigo:#2E3CA0;--indigo-ink:#FFFFFF;--indigo-soft:#E4E8FB;--tur:#F2B01E;--tur-soft:#FDF0C9;--tur-ink:#2A1E00;
--leaf:#177A5A;--leaf-soft:#DAF1E8;--mad:#B03A2C;--mad-soft:#F8E1DD;--side:#0A0A0A;--side-ink:#D8C9A0;--side-hi:#221C12;
--disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1128;--card:#171B3C;--ink:#E6E8F8;--muted:#9AA1CC;--line:#2A3064;--soft:#1D2248;--indigo:#8B99FF;--indigo-ink:#0E1128;--indigo-soft:#252C63;--tur-soft:#3A3011;--leaf:#4CD1A0;--leaf-soft:#12362B;--mad:#FF8A78;--mad-soft:#3F1E1B;--side:#0A0A0A;--side-hi:#221C12}}
:root[data-theme="dark"]{--bg:#0E1128;--card:#171B3C;--ink:#E6E8F8;--muted:#9AA1CC;--line:#2A3064;--soft:#1D2248;--indigo:#8B99FF;--indigo-ink:#0E1128;--indigo-soft:#252C63;--tur-soft:#3A3011;--leaf:#4CD1A0;--leaf-soft:#12362B;--mad:#FF8A78;--mad-soft:#3F1E1B;--side:#0A0A0A;--side-hi:#221C12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:17px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column;padding:16px 12px;overflow:auto;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;border-bottom:2px dashed rgba(242,176,30,.3)}
.brand b{display:block;color:#fff;font:700 17px var(--disp)}.brand small{color:var(--side-ink);font-size:12px}
.logoimg{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1.5px solid var(--tur);flex:none;background:#000}
.outsel{display:block;margin:14px 6px 8px;font-size:12px}.outsel span{display:block;margin-bottom:4px;color:var(--side-ink)}
.outsel b{color:#fff;font-weight:500}.outsel select{width:100%;background:var(--side-hi);border-color:transparent;color:#fff}
.side nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.side nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-weight:500;position:relative}
.side nav a:hover{background:var(--side-hi);color:#fff}
.side nav a.on{background:var(--side-hi);color:#fff}
.side nav a.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--tur)}
.sidefoot{margin-top:auto;padding:12px 6px 0;border-top:2px dashed rgba(242,176,30,.3);font-size:12px;color:var(--side-ink)}
.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:10px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line)}
.gs{flex:1;max-width:460px}
.topr{margin-left:auto;display:flex;gap:8px;align-items:center}
.view{padding:20px;max-width:1500px}
.menu{display:none}
.icbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--leaf)}
.pill.off i{background:var(--mad)}.pill.off{background:var(--mad-soft);border-color:transparent}
.pill.sync i{background:var(--tur);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.in{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:38px;max-width:100%}
.in.sm{min-height:38px;padding:6px 8px}
textarea.in{width:100%;min-height:140px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 14px;min-height:38px;font-weight:500;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--indigo);border-color:var(--indigo);color:var(--indigo-ink)}.btn.pri:hover{filter:brightness(1.1)}
.btn.warn{background:var(--tur);border-color:var(--tur);color:var(--tur-ink)}
.btn.bad{color:var(--mad);border-color:var(--mad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card>h2,.card>.ch{margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.muted{color:var(--muted)}.sm{font-size:12px}.r{text-align:right}.b{font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--leaf-soft);color:var(--leaf)}.badge.warn{background:var(--tur-soft);color:#8A5A00}.badge.bad{background:var(--mad-soft);color:var(--mad)}.badge.info{background:var(--indigo-soft);color:var(--indigo)}
:root[data-theme="dark"] .badge.warn{color:var(--tur)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.warn{color:var(--tur)}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:520px}

/* ================= GST / pricing engine ================= */
function calcBill(lines,o={}){
  const base=lines.map(l=>l.qty*l.price);
  const pre=lines.map((l,i)=>Math.max(0,base[i]-(l.disc||0)-(l.offer||0)));
  const sub=sum(pre);
  const bd=Math.min(sub,Math.max(0,(o.bill||0)));
  const out=lines.map((l,i)=>{
    const v=VAR[l.vid],p=PROD[v.pid];
    const net=sub?pre[i]-bd*pre[i]/sub:0;
    const per=l.qty?net/l.qty:0;
    const rate=rateFor(p,per);
    const taxable=net/(1+rate/100),tax=net-taxable;
    return {vid:l.vid,qty:l.qty,price:l.price,disc:l.disc||0,offer:l.offer||0,base:base[i],net,rate,taxable,tax,cgst:o.inter?0:tax/2,sgst:o.inter?0:tax/2,igst:o.inter?tax:0,hsn:p.hsn,cost:v.cost,ret:0};
  });
  const gross=sum(base),net=sum(out,x=>x.net),total=Math.round(net);
  return {lines:out,gross,discount:gross-net,net,roundOff:total-net,total,taxable:sum(out,x=>x.taxable),tax:sum(out,x=>x.tax),cgst:sum(out,x=>x.cgst),sgst:sum(out,x=>x.sgst),igst:sum(out,x=>x.igst),billDisc:bd};
}
function rateGroups(lines){const g={};lines.forEach(l=>{const k=l.rate;g[k]=g[k]||{rate:k,taxable:0,cgst:0,sgst:0,igst:0};g[k].taxable+=l.taxable;g[k].cgst+=l.cgst;g[k].sgst+=l.sgst;g[k].igst+=l.igst});return Object.values(g).sort((a,b)=>a.rate-b.rate)}

function code128(text){
  const codes=[104];for(const ch of text)codes.push(ch.charCodeAt(0)-32);
  let chk=104;for(let i=1;i<codes.length;i++)chk+=i*codes[i];codes.push(chk%103);codes.push(106);
  let x=10,bars='';
  codes.forEach(c=>{const pat=C128[c];for(let i=0;i<pat.length;i++){const w=+pat[i];if(i%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="40"/>`;x+=w}});
  return `<svg viewBox="0 0 ${x+10} 40" preserveAspectRatio="none" fill="#000" aria-label="Barcode ${esc(text)}">${bars}</svg>`;
}

function bars(data,h=140){
  const w=data.length*34,max=Math.max(1,...data.map(d=>d.v));
  return `<svg class="bars" viewBox="0 0 ${w} ${h+22}" role="img" aria-label="Bar chart">`+data.map((d,i)=>{const bh=Math.max(d.v?2:0,Math.round(d.v/max*h));return `<rect x="${i*34+6}" y="${h-bh}" width="22" height="${bh}" rx="3" fill="${d.hi?'var(--tur)':'var(--indigo)'}"><title>${esc(d.l)}: ${inr(d.v)}</title></rect><text x="${i*34+17}" y="${h+15}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(d.l)}</text>`}).join('')+'</svg>';
}

  const recv=sum(CUSTS,c=>c.dues),pay=sum(SUPPLIERS,s=>s.out);

  const pend=S.pending.length;
  return ph('Dashboard',scopeSel())+`

function posCalc(){
  const P=S.pos;
  const lines=P.cart.map(l=>{const p=PROD[VAR[l.vid].pid];return {vid:l.vid,qty:l.qty,price:p.mrp,disc:l.qty*p.mrp*(l.dp||0)/100,offer:0}});
  const offers=[];
  const tees=lines.filter(l=>PROD[VAR[l.vid].pid].cat==='Men › T-Shirts');
  if(sum(tees,l=>l.qty)>=2){tees.forEach(l=>{l.offer=(l.qty*l.price-l.disc)*.15});offers.push('Any 2 tees: 15% off the tees')}
  const after=sum(lines,l=>l.qty*l.price-l.disc-l.offer);
  let offerBill=0;if(after>=5000){offerBill=250;offers.push('Bill above ₹5,000: ₹250 off')}
  const manual=Math.max(0,Math.min(after,P.bdType==='%'?after*(+P.bdVal||0)/100:(+P.bdVal||0)));
  const inter=!!(P.cust&&CUST[P.cust].gstin&&CUST[P.cust].state&&CUST[P.cust].state!==SHOP.state);
  const c=calcBill(lines,{bill:manual+offerBill,inter});
  const gross=c.gross||1;
  const manPct=(sum(lines,l=>l.disc)+manual)/gross*100;
  const exch=P.exch?Math.min(P.exch.amount,c.total):0;
  const cust=P.cust?CUST[P.cust]:null;
  const maxRedeem=cust?Math.min(cust.points,Math.floor((c.total-exch)*.5)):0;
  const redeem=Math.min(P.redeem||0,maxRedeem);
  return {c,offers,manPct,limit:ROLES[S.role].disc,exch,redeem,maxRedeem,inter,due:Math.max(0,c.total-exch-redeem),lines};
}

function doReturn(inv,items,mode,cond,o={}){
  const lines=items.map(({i,q})=>{const l=inv.lines[i],f=q/l.qty;return {vid:l.vid,qty:q,net:l.net*f,taxable:l.taxable*f,tax:l.tax*f,cgst:l.cgst*f,sgst:l.sgst*f,igst:l.igst*f,rate:l.rate,hsn:l.hsn,cost:l.cost}});
  const amount=Math.round(sum(lines,l=>l.net));
  S.cnt[inv.outlet]++;
  const main=[...inv.payments].sort((a,b)=>b.amt-a.amt).find(p=>['cash','upi','card','credit'].includes(p.mode));
  const rm=mode==='original'?(main?main.mode:'cash'):mode;
  const cn={no:`CN/${inv.outlet}/${String(S.cnt[inv.outlet]).padStart(5,'0')}`,invNo:inv.no,ts:o.silent?inv.ts+36e5:Date.now(),amount,lines,mode:rm,cond,outlet:inv.outlet,shift:o.silent?null:(SH[inv.outlet]?SH[inv.outlet].id:null),cust:inv.cust,inter:inv.inter};
  items.forEach(({i,q})=>{inv.lines[i].ret+=q});CNS.unshift(cn);
  if(!o.silent){
    lines.forEach(l=>{if(cond==='sellable')move(l.vid,inv.outlet,l.qty,'Sale return',cn.no,l.cost);else move(l.vid,inv.outlet,l.qty,'Return, damaged (not sellable)',cn.no,l.cost,'Damaged')});
    const c=inv.cust?CUST[inv.cust]:null;
    if(c){if(rm==='store')c.store+=amount;if(rm==='credit')c.dues=Math.max(0,c.dues-amount)}
  }
  return cn;
}
A.retgo=()=>{

  audit('Return',`${cn.no} for ${inr(cn.amount)} against ${r.inv.no}, refund ${cn.mode}`);
  if(r.mode==='exchange'){S.pos.exch={amount:cn.amount,cn:cn.no};S.route='pos';closeModal();render();toast(`Credit note ${cn.no} created. ${inr(cn.amount)} will be adjusted on the new bill.`,'ok')}

};

   <div class="row" style="max-width:520px"><select class="in" id="tcat"><option value="">Whole store</option>${catTop().map(c=>`<option>${c}</option>`).join('')}</select><button class="btn pri" data-a="starttake" ${S.role==='Cashier'?'disabled':''}>Start stock-take</button></div></div>`;
  return `<div class="card"><div class="ch"><h2>Counting: ${t.cat||'whole store'} at ${cur().name}</h2><span style="display:flex;gap:6px"><button class="btn sm" data-a="takesample">Fill sample counts</button><button class="btn sm" data-a="takecancel">Cancel</button></span></div>

  ${tbl(['Item','>Expected','>Counted','>Variance','>Value'],t.vids.map(id=>{const c=t.cnt[id];return `<tr><td>${esc(vname(id))}</td><td class="r">${t.exp[id]}</td><td class="r"><input class="in mini" type="number" min="0" value="${c==null?'':c}" data-in="tcount" data-v="${id}"></td><td class="r" id="tv-${id}">${takeVar(id)}</td><td class="r" id="tx-${id}">${takeVal(id)}</td></tr>`}))}

function grnCalc(){
  const g=S.grn,lines=g.po.lines.filter(l=>(+g.recv[l.vid]||0)>0).map(l=>({vid:l.vid,q:+g.recv[l.vid],cost:l.cost}));
  const goods=sum(lines,l=>l.q*l.cost),qty=sum(lines,l=>l.q),ch=(+g.freight||0)+(+g.unload||0)+(+g.other||0);
  lines.forEach(l=>{const sh=g.alloc==='qty'?(qty?l.q/qty:0):(goods?l.q*l.cost/goods:0);l.add=ch*sh;l.unit=l.cost+l.add/l.q;l.tot=l.q*l.unit});
  return {lines,goods,qty,ch,itc:goods*g.po.gst/100,payable:goods*(1+g.po.gst/100)};
}
function grnPrev(){
  const c=grnCalc();
  return `<div class="tr"><span>Goods value</span><b>${inr(c.goods)}</b></div><div class="tr"><span>Freight, unloading and other</span><b>${inr(c.ch)}</b></div><div class="tr"><span>Input GST ${S.grn.po.gst}% (claimed as ITC, not in cost)</span><b>${inr(c.itc)}</b></div><div class="tr"><span>Payable to supplier</span><b>${inr(c.payable)}</b></div><hr class="stitch">
  ${c.lines.length?tbl(['Item','>Received','>Invoice cost','>Landed cost','>New avg cost'],c.lines.map(l=>{const v=VAR[l.vid],old=stkAll(l.vid);const na=(old*v.cost+l.q*l.unit)/(old+l.q);return `<tr><td>${esc(vname(l.vid))}</td><td class="r">${l.q}</td><td class="r">${inr(l.cost)}</td><td class="r"><b>${inr(l.unit)}</b></td><td class="r">${inr(na)}</td></tr>`})):'<div class="muted">Enter received quantities above.</div>'}`;
}
function renderGRN(){
  const g=S.grn;
  openModal('Receive goods for '+g.po.no,`<div class="muted sm">${esc(SUP[g.po.sid].name)}. Stock is added to ${cur().name} when you post.</div>
  ${tbl(['Item','>Ordered','>Pending','>Receive now'],g.po.lines.filter(l=>l.qty>l.recv).map(l=>`<tr><td>${esc(vname(l.vid))}</td><td class="r">${l.qty}</td><td class="r">${l.qty-l.recv}</td><td class="r"><input class="in mini" type="number" min="0" max="${l.qty-l.recv}" value="${g.recv[l.vid]}" data-in="grnq" data-v="${l.vid}"></td></tr>`))}
  <div class="row" style="margin-top:12px"><label class="fld"><span>Freight</span><input class="in" type="number" min="0" data-in="grnc" data-k="freight" value="${g.freight}" placeholder="0"></label><label class="fld"><span>Unloading</span><input class="in" type="number" min="0" data-in="grnc" data-k="unload" value="${g.unload}" placeholder="0"></label><label class="fld"><span>Other charges</span><input class="in" type="number" min="0" data-in="grnc" data-k="other" value="${g.other}" placeholder="0"></label><label class="fld"><span>Spread charges by</span><select class="in" data-ch="grnalloc"><option value="value" ${g.alloc==='value'?'selected':''}>Value</option><option value="qty" ${g.alloc==='qty'?'selected':''}>Quantity</option></select></label></div>
  <div id="grnPrev">${grnPrev()}</div>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="postgrn">Post receipt and update stock</button>`,true);
}
IN.grnq=el=>{const l=S.grn.po.lines.find(x=>x.vid===el.dataset.v);S.grn.recv[el.dataset.v]=Math.max(0,Math.min(l.qty-l.recv,Math.floor(+el.value||0)));$('#grnPrev').innerHTML=grnPrev()};

A.postgrn=()=>{
  const g=S.grn,c=grnCalc();if(!c.lines.length){toast('Enter at least one received quantity','bad');return}
  const no='GRN-'+(2220+GRNS.length-1);
  c.lines.forEach(l=>{const v=VAR[l.vid],old=stkAll(l.vid);v.cost=Math.round((old*v.cost+l.q*l.unit)/(old+l.q)*100)/100;move(l.vid,S.outlet,l.q,'GRN',no,l.unit);g.po.lines.find(x=>x.vid===l.vid).recv+=l.q});
  SUP[g.po.sid].out+=c.payable;
  GRNS.unshift({no,po:g.po.no,sid:g.po.sid,ts:Date.now(),outlet:S.outlet,goods:c.goods,charges:c.ch,itc:c.itc,pieces:c.qty});
  audit('Goods received',`${no} against ${g.po.no}, ${c.qty} pieces`);
  const vids=c.lines.map(l=>({vid:l.vid,n:l.q}));S.grn=null;render();

};

function shiftStats(sh){
  const inv=INV.filter(i=>i.shift===sh.id&&i.status!=='Void'),by={cash:0,upi:0,card:0,credit:0,store:0,points:0,exchange:0};
  inv.forEach(i=>i.payments.forEach(p=>{by[p.mode]=(by[p.mode]||0)+p.amt}));
  const cn=CNS.filter(c=>c.shift===sh.id),refCash=sum(cn.filter(c=>c.mode==='cash'),c=>c.amount);
  const pIn=sum(sh.petty.filter(p=>p.dir==='in'),p=>p.amt),pOut=sum(sh.petty.filter(p=>p.dir==='out'),p=>p.amt);
  return {inv,by,sales:sum(inv,i=>i.total),disc:sum(inv,i=>i.discount),refCash,refunds:sum(cn,c=>c.amount),pIn,pOut,voids:INV.filter(i=>i.shift===sh.id&&i.status==='Void').length,expected:sh.float+by.cash-refCash+pIn-pOut};
}

  else{
    const s=shiftStats(sh),blind=S.role==='Cashier';
    top=`<div class="grid g2"><div class="card"><div class="ch"><h2>Shift ${sh.id}</h2>${badge('Open','ok')}</div><p class="muted sm">Opened ${dt(sh.openedAt)} by ${esc(sh.opener)} with a float of ${inr(sh.float)}.</p>
     <div class="list"><div><span>Sales (${s.inv.length} bills)</span><b>${inr(s.sales)}</b></div>${['cash','upi','card','credit'].map(m=>`<div><span>${m.toUpperCase()}</span><span>${inr(s.by[m])}</span></div>`).join('')}<div><span>Discounts given</span><span>${inr(s.disc)}</span></div><div><span>Returns and refunds</span><span>${inr(s.refunds)}</span></div><div><span>Voided bills</span><span>${s.voids}</span></div><div><span>Petty cash (in / out)</span><span>${inr(s.pIn)} / ${inr(s.pOut)}</span></div>
     <div><span><b>Expected cash in drawer</b></span><b>${blind?'Hidden until you count':inr(s.expected)}</b></div></div>
     <hr class="stitch"><h3>Petty cash</h3><div class="row" style="align-items:end"><select class="in" id="pcd"><option value="out">Cash out</option><option value="in">Cash in</option></select><input class="in" id="pca" type="number" placeholder="Amount"><input class="in" id="pcr" placeholder="Reason, e.g. tea and snacks"><button class="btn" data-a="petty">Add</button></div>
     ${sh.petty.length?`<div class="list" style="margin-top:8px">${sh.petty.map(p=>`<div><span>${p.dir==='out'?'Out':'In'}: ${esc(p.why)}</span><span>${inr(p.amt)}</span></div>`).join('')}</div>`:''}</div>
     <div class="card"><h2>Close shift: count the cash</h2><p class="sm muted">${blind?'Blind close is on for cashiers. The expected amount stays hidden until you submit. A manager approves the count.':'Count the drawer by denomination.'}</p>
     <div class="scroll"><table class="tbl" style="min-width:0">${DENOMS.map(d=>`<tr><td>${inr(d)} ${d>=10?'notes':'coins'}</td><td class="r"><input class="in mini" type="number" min="0" data-in="denom" data-d="${d}" placeholder="0"></td><td class="r" id="dn${d}" style="width:90px"></td></tr>`).join('')}</table></div>
     <div class="tr tot"><span>Counted</span><span id="cntTot">₹0</span></div><div id="varBox"></div>
     <label class="fld" style="margin-top:8px"><span>Reason for any difference</span><input class="in" id="varReason" placeholder="Needed if counted cash does not match"></label>
     <button class="btn pri" style="width:100%;min-height:46px" data-a="closeshift">${S.role==='Cashier'?'Submit for approval':'Close shift'}</button></div></div>`;
  }
  return ph('Shift and cash')+top+`<div class="card" style="margin-top:14px"><h2>Shift history</h2>${hist.length?tbl(['Shift','Opened by','>Sales','>Expected','>Counted','>Difference','Status',''],hist.map((h,i)=>`<tr><td><b>${h.id}</b><br><span class="sm muted">${dt(h.closedAt)}</span></td><td>${esc(h.opener)}</td><td class="r">${inr(h.sales)}</td><td class="r">${inr(h.expected)}</td><td class="r">${inr(h.counted)}</td><td class="r"><b style="color:${h.variance?'var(--mad)':'var(--leaf)'}">${h.variance>0?'+':''}${h.variance}</b>${h.reason?`<br><span class="sm muted">${esc(h.reason)}</span>`:''}</td><td>${badge(h.status,h.status==='Closed'?'ok':'warn')}</td><td>${h.status==='Awaiting approval'&&S.role!=='Cashier'?`<button class="btn sm pri" data-a="apprshift" data-id="${h.id}">Approve</button>`:''}</td></tr>`)):'<div class="empty">No closed shifts yet.</div>'}</div>`;
};

function repInv(){const from=TODAY-(S.repDays-1)*DAY;return live().filter(i=>inScope(i)&&i.ts>=from)}

const group=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);(m[k]=m[k]||[]).push(x)});return m};

REP.sales=()=>{
  const inv=repInv(),cn=repCN(),gross=sum(inv,i=>i.total),ret=sum(cn,c=>c.amount);
  const days=[];for(let d=S.repDays-1;d>=0;d--){const s=TODAY-d*DAY;days.push({l:String(new Date(s).getDate()),v:sum(inv.filter(i=>i.ts>=s&&i.ts<s+DAY),i=>i.total),hi:d===0})}
  const lines=inv.flatMap(i=>i.lines.map(l=>({...l,cashier:i.cashier,outlet:i.outlet}))),cat=group(lines,l=>PROD[VAR[l.vid].pid].cat.split(' › ')[0]),brand=group(lines,l=>PROD[VAR[l.vid].pid].brand),cash=group(inv,i=>i.cashier);

};
REP.stock=()=>{
  const catv=group(VARS,v=>PROD[v.pid].cat.split(' › ')[0]);
  const rows=Object.entries(catv).map(([k,vs])=>({k,u:sum(vs,v=>stkScope(v.id)),c:sum(vs,v=>stkScope(v.id)*v.cost),m:sum(vs,v=>stkScope(v.id)*PROD[v.pid].mrp)}));
  const broken=[];PRODS.forEach(p=>p.colors.forEach(c=>{const vs=p.vids.map(id=>VAR[id]).filter(v=>v.color===c),have=vs.filter(v=>stkScope(v.id)>0);if(p.sizes.length>2&&have.length&&have.length<vs.length)broken.push({n:`${p.name}, ${c}`,miss:vs.filter(v=>stkScope(v.id)===0).map(v=>v.size).join(', '),left:sum(vs,v=>stkScope(v.id))})}));
  const sold={};repInv().forEach(i=>i.lines.forEach(l=>{sold[l.vid]=(sold[l.vid]||0)+l.qty}));
  const dead=VARS.filter(v=>stkScope(v.id)>=4&&!sold[v.id]).sort((a,b)=>stkScope(b.id)*b.cost-stkScope(a.id)*a.cost).slice(0,8);
  return `<div class="grid g2"><div class="card"><h2>Stock valuation</h2>${tbl(['Category','>Pieces','>At cost','>At MRP'],rows.map(r=>`<tr><td>${r.k}</td><td class="r">${num(r.u)}</td><td class="r">${inr(r.c)}</td><td class="r">${inr(r.m)}</td></tr>`),`<tr><td>Total</td><td class="r">${num(sum(rows,r=>r.u))}</td><td class="r">${inr(sum(rows,r=>r.c))}</td><td class="r">${inr(sum(rows,r=>r.m))}</td></tr>`)}</div>
  <div class="card"><h2>Broken size runs</h2><p class="sm muted" style="margin-top:0">Some sizes are gone while others remain. These styles lose sales first.</p>${broken.length?tbl(['Style and colour','Missing sizes','>Pieces left'],broken.slice(0,10).map(b=>`<tr><td>${esc(b.n)}</td><td>${esc(b.miss)}</td><td class="r">${b.left}</td></tr>`)):'<div class="empty">All size runs are complete.</div>'}</div></div>
  <div class="card" style="margin-top:14px"><h2>Dead stock (no sales in this period)</h2>${dead.length?tbl(['Item','>Pieces','>Cost tied up'],dead.map(v=>`<tr><td>${esc(vname(v.id))}</td><td class="r">${stkScope(v.id)}</td><td class="r">${inr(stkScope(v.id)*v.cost)}</td></tr>`)):'<div class="empty">Nothing stuck.</div>'}</div>`;
};
REP.profit=()=>{
  const lines=repInv().flatMap(i=>i.lines),f=(g)=>Object.entries(group(lines,g)).map(([k,v])=>{const r=sum(v,l=>l.taxable),c=sum(v,l=>l.qty*l.cost);return {k,r,c,m:r-c,p:r?(r-c)/r*100:0}}).sort((a,b)=>b.m-a.m);
  const tb=rows=>tbl(['Name','>Revenue (ex-GST)','>Cost','>Gross margin','>Margin %'],rows.map(x=>`<tr><td>${esc(x.k)}</td><td class="r">${inr(x.r)}</td><td class="r">${inr(x.c)}</td><td class="r"><b>${inr(x.m)}</b></td><td class="r">${badge(pct(x.p),x.p<35?'bad':x.p<45?'warn':'ok')}</td></tr>`));
  const tot=lines.length?{r:sum(lines,l=>l.taxable),c:sum(lines,l=>l.qty*l.cost)}:{r:0,c:0};
  return `<div class="card"><div class="muted">Overall gross margin</div><div style="font:700 30px var(--disp)">${inr(tot.r-tot.c)} <span class="muted" style="font-size:16px">${pct(tot.r?(tot.r-tot.c)/tot.r*100:0)} of ${inr(tot.r)}</span></div><p class="sm muted" style="margin-bottom:0">Revenue is after discounts and excludes GST. Cost uses the landed cost recorded at sale time.</p></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>By category</h2>${tb(f(l=>PROD[VAR[l.vid].pid].cat))}</div><div class="card"><h2>By brand</h2>${tb(f(l=>PROD[VAR[l.vid].pid].brand))}</div></div>`;
};
REP.gst=()=>{
  const inv=repInv(),cn=repCN(),b2b=inv.filter(i=>i.cust&&CUST[i.cust].gstin),b2c=inv.filter(i=>!(i.cust&&CUST[i.cust].gstin));
  const g=rateGroups(b2c.flatMap(i=>i.lines)),hs=group(inv.flatMap(i=>i.lines),l=>l.hsn);
  const out=sum(inv,i=>i.tax)-sum(cn,c=>sum(c.lines,l=>l.tax)),itc=sum(GRNS.filter(x=>x.ts>=TODAY-(S.repDays-1)*DAY),x=>x.itc);
  const nos=inv.map(i=>i.no).sort();
  return `<div class="grid g3"><div class="card"><div class="muted">Output tax (net of credit notes)</div><div style="font:700 26px var(--disp)">${inr(out)}</div></div><div class="card"><div class="muted">Input tax credit from receipts</div><div style="font:700 26px var(--disp)">${inr(itc)}</div></div><div class="card"><div class="muted">Estimated GSTR-3B payable</div><div style="font:700 26px var(--disp)">${inr(Math.max(0,out-itc))}</div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>Table 7: B2C small, by rate</h2>${tbl(['Rate','>Taxable','>CGST','>SGST','>IGST'],g.map(x=>`<tr><td>${x.rate}%</td><td class="r">${inr(x.taxable)}</td><td class="r">${inr(x.cgst)}</td><td class="r">${inr(x.sgst)}</td><td class="r">${inr(x.igst)}</td></tr>`))}<p class="sm muted">Slab rate is decided by the discounted price per piece.</p></div>
  <div class="card"><h2>Table 4: B2B invoices</h2>${b2b.length?tbl(['Bill','GSTIN','>Taxable','>IGST'],b2b.slice(0,8).map(i=>`<tr><td>${i.no}</td><td>${CUST[i.cust].gstin}</td><td class="r">${inr(i.taxable)}</td><td class="r">${inr(i.igst)}</td></tr>`)):'<div class="empty">No B2B bills in this period.</div>'}</div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>HSN summary</h2>${tbl(['HSN','>Pieces','>Taxable','>Tax'],Object.entries(hs).map(([k,v])=>`<tr><td>${k}</td><td class="r">${sum(v,l=>l.qty)}</td><td class="r">${inr(sum(v,l=>l.taxable))}</td><td class="r">${inr(sum(v,l=>l.tax))}</td></tr>`))}</div>
  <div class="card"><h2>Documents issued and credit notes</h2><div class="list"><div><span>Invoices issued</span><b>${INV.filter(i=>inScope(i)&&i.ts>=TODAY-(S.repDays-1)*DAY).length}</b></div><div><span>Series range</span><span>${nos[0]||'-'} to ${nos[nos.length-1]||'-'}</span></div><div><span>Cancelled</span><b>${INV.filter(i=>inScope(i)&&i.status==='Void').length}</b></div><div><span>Credit notes</span><b>${cn.length}</b></div></div><button class="btn" style="margin-top:10px" data-a="gstjson">Preview GSTR-1 JSON</button></div></div>`;
};
A.gstjson=()=>{
  const inv=repInv(),b2c=inv.filter(i=>!(i.cust&&CUST[i.cust].gstin)),g=rateGroups(b2c.flatMap(i=>i.lines));
  const json={gstin:SHOP.gstin,fp:new Date().toLocaleDateString('en-IN',{month:'2-digit',year:'numeric'}).replace('/',''),b2cs:g.map(x=>({sply_ty:'INTRA',rt:x.rate,txval:+x.taxable.toFixed(2),camt:+x.cgst.toFixed(2),samt:+x.sgst.toFixed(2)})),b2b:inv.filter(i=>i.cust&&CUST[i.cust].gstin).slice(0,3).map(i=>({ctin:CUST[i.cust].gstin,inum:i.no,val:i.total,itms:i.lines.map(l=>({rt:l.rate,txval:+l.taxable.toFixed(2),iamt:+l.igst.toFixed(2)}))})),hsn:Object.entries(group(inv.flatMap(i=>i.lines),l=>l.hsn)).map(([k,v])=>({hsn_sc:k,qty:sum(v,l=>l.qty),txval:+sum(v,l=>l.taxable).toFixed(2)}))};
  openModal('GSTR-1 JSON preview (sample structure)',`<textarea class="in" readonly style="min-height:300px" id="csvbox">${esc(JSON.stringify(json,null,2))}</textarea>`,`<button class="btn" data-a="copybox">Copy</button><button class="btn pri" data-a="close">Close</button>`,true);
};
REP.movers=()=>{
  const sold={};repInv().forEach(i=>i.lines.forEach(l=>{const p=VAR[l.vid].pid;sold[p]=(sold[p]||0)+l.qty}));
  const weeks=S.repDays/7;
  const rows=PRODS.map(p=>{const s=sold[p.id]||0,st=sum(p.vids,v=>stkScope(v)),st2=s+st;return {p,s,st,tp:st2?s/st2*100:0,cover:s?st/(s/Math.max(weeks,1/7)):Infinity}}).sort((a,b)=>b.s-a.s);
  const vs={};repInv().forEach(i=>i.lines.forEach(l=>{vs[l.vid]=(vs[l.vid]||0)+l.qty}));
  const topv=Object.entries(vs).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="grid g21"><div class="card"><h2>By style: sold, in stock, sell-through and cover</h2>${tbl(['Style','>Sold','>In stock','>Sell-through','>Weeks of cover',''],rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td class="r">${r.s}</td><td class="r">${r.st}</td><td class="r">${pct(r.tp)}</td><td class="r">${r.cover===Infinity?'No sales':(Math.round(r.cover*10)/10)}</td><td>${r.s===0?badge('Slow','bad'):r.tp>=40?badge('Fast','ok'):r.cover>12?badge('Slow','warn'):''}</td></tr>`))}</div>
  <div class="card"><h2>Best selling variants</h2><div class="list">${topv.map(([id,q])=>`<div><span>${esc(vname(id))}</span><b>${q} pcs</b></div>`).join('')||'<div class="muted">No sales yet</div>'}</div></div></div>`;
};
REP.cash=()=>{
  const inv=repInv(),modes={};inv.forEach(i=>i.payments.forEach(p=>{modes[p.mode]=(modes[p.mode]||0)+p.amt}));
  const dues=CUSTS.filter(c=>c.dues>0);
  return `<div class="grid g2"><div class="card"><h2>Payment mode summary</h2>${tbl(['Mode','>Amount'],Object.entries(modes).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k.toUpperCase()}</td><td class="r">${inr(v)}</td></tr>`))}</div>
  <div class="card"><h2>Receivables ageing</h2>${dues.length?tbl(['Customer','>Outstanding','>Days'],dues.map(c=>`<tr><td>${esc(c.name)}</td><td class="r">${inr(c.dues)}</td><td class="r">${badge(Math.floor((Date.now()-(c.dueSince||Date.now()))/DAY)+' days',(Date.now()-(c.dueSince||Date.now()))/DAY>30?'bad':'warn')}</td></tr>`)):'<div class="empty">No customer dues.</div>'}</div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>Payables to suppliers</h2>${tbl(['Supplier','Terms','>Outstanding'],SUPPLIERS.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.terms}</td><td class="r">${inr(s.out)}</td></tr>`))}</div>
  <div class="card"><h2>Shift differences</h2>${tbl(['Shift','>Expected','>Counted','>Difference'],SHIFT_HIST.map(h=>`<tr><td>${h.id}</td><td class="r">${inr(h.expected)}</td><td class="r">${inr(h.counted)}</td><td class="r"><b style="color:${h.variance?'var(--mad)':'var(--leaf)'}">${h.variance>0?'+':''}${h.variance}</b></td></tr>`))}</div></div>`;
};
A.exportcsv=()=>{
  const rows=[];$$('#repBody table').forEach(t=>{$$('tr',t).forEach(tr=>rows.push([...tr.children].map(c=>'"'+(c.innerText||c.textContent).replace(/\s+/g,' ').trim().replace(/"/g,'""')+'"').join(',')));rows.push('')});
  openModal('Export to Excel or CSV',`<p class="sm muted">In the full product this downloads an .xlsx or .csv file. In this preview, copy the text below and paste it into Excel or Google Sheets.</p><textarea class="in" readonly id="csvbox">${esc(rows.join('\n'))}</textarea>`,`<button class="btn" data-a="close">Close</button><button class="btn pri" data-a="copybox">Copy to clipboard</button>`);
};
A.copybox=()=>{const t=$('#csvbox');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}try{if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>{},()=>{});ok=true}catch(e){}toast(ok?'Copied':'Select the text and copy it manually',ok?'ok':'warn')};
A.exportpdf=()=>{try{window.print()}catch(e){toast('Printing is not available in this preview','warn')}};

/* ================= users & security ================= */
VIEWS.users=()=>{
  const caps=[['Bill, hold and print',1,1,1],['Discount limit','No limit','25%','10%, PIN above'],['Returns and exchanges',1,1,'Within 7 days'],['Void a bill',1,1,0],['See cost price and margin',1,1,0],['Adjust stock and approve stock-takes',1,1,0],['Create purchase orders and receive goods',1,1,0],['Close shift',1,1,'Submit only'],['Reports','All outlets','Own outlet','None'],['Users, settings and GST setup',1,0,0]];
  const c=v=>v===1?'✓':v===0?'✕':v;
  return ph('Users and security',`<button class="btn pri" data-a="adduser">Add user</button>`)+`<div class="grid g2"><div class="card"><h2>Team</h2>${tbl(['Name','Role','Outlet','Last active'],USERS.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${badge(u.role,u.role==='Owner'?'warn':u.role==='Manager'?'info':'')}</td><td>${u.outlet}</td><td>${u.seen}</td></tr>`))}<p class="sm muted">Cashiers switch users with a quick PIN. The Owner signs in with a second factor.</p></div>
  <div class="card"><h2>What each role can do</h2>${tbl(['Capability','Owner','Manager','Cashier'],caps.map(r=>`<tr><td>${r[0]}</td>${[1,2,3].map(i=>`<td style="color:${r[i]===0?'var(--mad)':r[i]===1?'var(--leaf)':'inherit'}">${c(r[i])}</td>`).join('')}</tr>`))}<p class="sm muted">Use the role switch in the top bar to feel the difference.</p></div></div>
  <div class="card" style="margin-top:14px"><h2>Activity log</h2><p class="sm muted" style="margin-top:0">Append-only. Invoices are never edited or deleted, only voided or credited. Everything you do in this demo appears here.</p>${tbl(['When','User','Role','Action','Detail'],S.log.slice(0,40).map(l=>`<tr><td>${dt(l.ts)}</td><td>${esc(l.user)}</td><td>${l.role}</td><td><b>${esc(l.action)}</b></td><td>${esc(l.detail)}</td></tr>`))}</div>`;
};
A.adduser=()=>{openModal('Add user',`<div class="row"><label class="fld"><span>Name</span><input class="in" id="unm"></label><label class="fld"><span>Role</span><select class="in" id="urole"><option>Cashier</option><option>Manager</option></select></label></div><label class="fld"><span>Outlet</span><select class="in" id="uout">${OUTLETS.map(o=>`<option>${o.name}</option>`).join('')}</select></label>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="saveuser">Add user</button>`)};
A.saveuser=()=>{const n=$('#unm').value.trim();if(!n){toast('Enter a name','bad');return}USERS.push({name:n,role:$('#urole').value,outlet:$('#uout').value,seen:'Never'});audit('User added',n+' as '+$('#urole').value);closeModal();render();toast('User added','ok')};

/* ================= global actions ================= */
A.close=()=>closeModal();
A.ovclose=(el,e)=>{if(e.target===el)closeModal()};
A.nav=(el,e)=>{if(e&&e.preventDefault)e.preventDefault();S.route=el.dataset.r;S.navOpen=false;try{history.replaceState(null,'','#/'+S.route)}catch(x){}render();window.scrollTo(0,0)};
A.navopen=(el,e)=>{if(e&&e.preventDefault)e.preventDefault();S.navOpen=true;render()};
A.navclose=()=>{S.navOpen=false;render()};
A.theme=()=>{const r=document.documentElement,d=r.getAttribute('data-theme');const isDark=d==='dark'||(!d&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',isDark?'light':'dark')};
A.lang=()=>{S.lang=S.lang==='hi'?'en':'hi';render()};
A.toggleonline=()=>{
  if(S.syncing)return;
  S.online=!S.online;
  if(S.online&&S.outbox.length){A.sync()}else{render();toast(S.online?'Back online':'Offline mode. Billing keeps working and bills are queued.',S.online?'ok':'warn')}
};
A.sync=()=>{
  if(!S.outbox.length)return;
  S.syncing=true;render();const n=S.outbox.length;
  setTimeout(()=>{INV.forEach(i=>{if(i.sync==='pending')i.sync='synced'});S.outbox=[];S.syncing=false;audit('Sync',n+' offline bills uploaded');render();toast(n+' offline bill'+(n>1?'s':'')+' synced. Duplicates are prevented by an idempotency key.','ok')},900);
};
CH.role=el=>{S.role=el.value;if(S.role!=='Owner'){S.outlet='FL';S.scope='one'}else S.scope='all';S.pos.apPct=0;S.pos.apBy='';audit('Switched user',ROLES[S.role].user+' as '+S.role);render();toast('Now using the app as '+S.role+' ('+ROLES[S.role].user+')')};
CH.outlet=el=>{S.outlet=el.value;if(S.pos.cart.length){resetPos();toast('Bill cleared because you changed outlet','warn')}S.take=null;render()};
KD.gs=(el,e)=>{
  if(e.key!=='Enter')return;const q=el.value.trim().toLowerCase();if(!q)return;
  const v=VARS.find(x=>x.barcode===q);
  if(v&&allowed('inv')){S.invSearch=PROD[v.pid].name;S.invTab='catalog';S.route='inv';render();toast('Found: '+vname(v.id));return}
  const inv=INV.find(i=>i.no.toLowerCase()===q||i.no.toLowerCase().endsWith('/'+q));if(inv){S.route='bills';render();openBill(inv.no);return}
  const c=CUSTS.find(x=>x.phone.includes(q)||x.name.toLowerCase().includes(q));if(c){S.route='cust';render();openCust(c.id);return}
  const p=PRODS.find(x=>(x.name+x.code+x.brand).toLowerCase().includes(q));
  if(p&&allowed('inv')){S.invSearch=q;S.invTab='catalog';S.route='inv';render();return}
  toast('Nothing found for "'+el.value+'"','bad');
};

/* ================= events ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modalRoot .ov')){closeModal();return}
  const el=e.target.closest('[data-kd]');if(el&&KD[el.dataset.kd])KD[el.dataset.kd](el,e);
});
window.__demo={S,A,CH,IN,KD,render,INV,VARS,PRODS,posCalc,addToCart,calcBill,STOCK,VIEWS};
const h=(location.hash||'').replace('#/','');if(VIEWS[h])S.route=h;
render();
})();
</script>
